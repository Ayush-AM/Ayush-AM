<svg fill="none" width="850" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-Layer Orange Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ff6b00" stroke-width="0.3" stroke-opacity="0.15" />
    </pattern>

    <!-- Moving Laser Light Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3300" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF7700" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFCC00" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="50%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #07090e; rx: 14px; stroke: url(#border-grad); stroke-width: 1.8; }
    
    .title {
      font-family: 'Orbitron', 'Consolas', 'Segoe UI', monospace;
      font-size: 34px;
      font-weight: 900;
      fill: url(#title-grad);
      filter: url(#neon-glow);
      letter-spacing: 5px;
    }

    .role-title {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 15px;
      font-weight: 700;
      fill: #FF9900;
      letter-spacing: 2px;
    }

    .details-text {
      font-family: 'Consolas', monospace;
      font-size: 12.5px;
      fill: #9ca3af;
      letter-spacing: 1px;
    }

    .hud-line { stroke: #ff7700; stroke-width: 2; opacity: 0.8; }
    .hud-text { font-family: 'Consolas', monospace; font-size: 10px; fill: #ff7700; opacity: 0.7; letter-spacing: 1px; }

    /* Left-to-Right Neon Laser Sweep Animation */
    .laser-line {
      animation: sweep 3.5s linear infinite;
    }

    @keyframes sweep {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(850px); }
    }
  </style>

  <!-- Main Background Panel -->
  <rect width="850" height="240" class="bg" />

  <!-- Cyber Grid Overlay -->
  <rect width="850" height="240" fill="url(#cyber-grid)" rx="14" />

  <!-- Animated Orange Neon Laser Sweep Bar (Top & Bottom) -->
  <g class="laser-line">
    <rect x="0" y="2" width="280" height="3" fill="url(#laser-grad)" filter="url(#neon-glow)" />
    <rect x="0" y="235" width="280" height="3" fill="url(#laser-grad)" filter="url(#neon-glow)" />
  </g>

  <!-- Sci-Fi HUD Corner Brackets -->
  <path d="M 20 35 L 20 20 L 35 20" class="hud-line" />
  <path d="M 830 35 L 830 20 L 815 20" class="hud-line" />
  <path d="M 20 205 L 20 220 L 35 220" class="hud-line" />
  <path d="M 830 205 L 830 220 L 815 220" class="hud-line" />

  <!-- HUD Technical Labels -->
  <text x="38" y="32" class="hud-text">PROFILE // AYUSH-AM</text>
  <text x="812" y="32" text-anchor="end" class="hud-text">STATUS: ACTIVE</text>

  <!-- Main Title & Humble Details -->
  <g transform="translate(425, 75)">
    <text x="0" y="0" text-anchor="middle" class="title">AYUSH MAHAJAN</text>
    <text x="0" y="32" text-anchor="middle" class="role-title">AI &amp; FULL-STACK DEVELOPER</text>
    <text x="0" y="58" text-anchor="middle" class="details-text">Building software, exploring AI systems &amp; contributing to open source</text>
  </g>

  <!-- Sci-Fi Status Console -->
  <g transform="translate(425, 195)">
    <rect x="-270" y="-14" width="540" height="28" rx="14" fill="#0d111a" stroke="#FF5500" stroke-width="1.2" />
    
    <text x="0" y="4" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#FFA500" font-weight="bold">
      [ STATUS: ACTIVE ]  •  [ FOCUS: AI &amp; FULL-STACK ]  •  [ OPEN SOURCE: CONTRIBUTOR ]
    </text>
  </g>
</svg>
