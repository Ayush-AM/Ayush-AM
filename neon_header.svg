<svg fill="none" width="850" height="210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Orange Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Moving Laser Light Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3300" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF7700" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFCC00" stop-opacity="0" />
    </linearGradient>
    
    <!-- Neon Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #0b0e14; rx: 12px; stroke: url(#border-grad); stroke-width: 1.5; }
    
    .title {
      font-family: 'Orbitron', 'Fira Code', 'Segoe UI', monospace;
      font-size: 32px;
      font-weight: 900;
      fill: #FFA500;
      filter: url(#neon-glow);
      letter-spacing: 4px;
    }

    /* Left-to-Right Neon Laser Sweep Animation */
    .laser-line {
      animation: sweep 3s linear infinite;
    }

    @keyframes sweep {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(850px); }
    }
  </style>

  <!-- Main Background Container -->
  <rect width="850" height="210" class="bg" />

  <!-- Animated Orange Neon Laser Sweep Bar -->
  <g class="laser-line">
    <rect x="0" y="2" width="250" height="3" fill="url(#laser-grad)" filter="url(#neon-glow)" />
    <rect x="0" y="205" width="250" height="3" fill="url(#laser-grad)" filter="url(#neon-glow)" />
  </g>

  <!-- Glowing Title -->
  <g transform="translate(425, 60)">
    <text x="0" y="0" text-anchor="middle" class="title">AYUSH MAHAJAN</text>
  </g>

  <!-- Dynamic Orange Neon Typing Animation embedded inside header -->
  <g transform="translate(100, 75)">
    <image href="https://readme-typing-svg.demolab.com?font=Fira+Code&amp;weight=700&amp;size=16&amp;duration=3000&amp;pause=1000&amp;color=FFA500&amp;center=true&amp;vCenter=true&amp;width=650&amp;height=50&amp;lines=AI+Engineer+%26+Systems+Architect;Autonomous+Multi-Agent+Developer;Full-Stack+Web3+%26+RAG+Specialist;Open-Source+Contributor" width="650" height="50" />
  </g>

  <!-- Status Bar -->
  <g transform="translate(425, 172)">
    <rect x="-240" y="-12" width="480" height="24" rx="12" fill="#161b22" stroke="#FF5500" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#FFA500" font-weight="bold">
      [ STATUS: ONLINE ]  •  [ SYSTEM: RAG &amp; MULTI-AGENT CORE ]  •  [ OPEN SOURCE: ACTIVE ]
    </text>
  </g>
</svg>
